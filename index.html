<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2048 — Folder Images</title>
  <style>
    body{margin:0;font-family:sans-serif;background:#faf8ef;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh}
    #board{display:grid;grid-template-columns:repeat(4,100px);grid-gap:10px;background:#bbada0;padding:10px;border-radius:10px;position:relative}
    .cell{width:100px;height:100px;background:#cdc1b4;border-radius:5px;position:relative}
    .tile{position:absolute;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:20px;font-weight:bold;color:#fff;border-radius:5px;text-align:center;padding:5px;}
    .tile img{width:100%;height:100%;object-fit:cover;border-radius:5px}
    .watermark{margin-top:15px;font-size:14px;color:#776e65;opacity:0.7;user-select:none;text-align:center;width:100%;}
    .watermark span.star{font-size:14px;color:#776e65;margin-left:2px}

    #passwordPrompt {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#faf8ef;
    }
    #passwordPrompt input {
      padding:8px;
      font-size:16px;
      margin-top:10px;
    }
    #passwordPrompt button {
      margin-top:10px;
      padding:8px 16px;
      font-size:16px;
      cursor:pointer;
    }

    #gameOverOverlay {
      position:absolute;
      top:0;left:0;
      width:100%;height:100%;
            background:rgba(238,228,218,0.8);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      font-size:32px;
      color:#776e65;
      font-weight:bold;
      border-radius:10px;
      z-index:10;
    }
    #gameOverOverlay button {
      margin-top:20px;
      padding:10px 20px;
      font-size:18px;
      cursor:pointer;
    }

    #scoreboard {
      margin-bottom:20px;
      text-align:center;
      font-size:18px;
      color:#776e65;
    }
    #scoreboard div {margin:5px 0;}

    #leaderboardContainer {
      margin:0 auto 20px;
      background:#eee4da;
      padding:12px 16px;
      border-radius:8px;
      max-width:320px;
      color:#776e65;
    }
    #leaderboardContainer h3 {
      margin:0 0 8px;
      font-size:18px;
      text-align:center;
    }
    #leaderboardList {
      padding-left:18px;
      margin:0;
    }
    #leaderboardList li {
      margin:4px 0;
      font-size:16px;
    }
    #leaderboardForm {
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:center;
      margin-top:12px;
    }
    #leaderboardForm input {
      padding:6px 8px;
      width:100%;
      max-width:220px;
      font-size:16px;
    }
    #leaderboardForm button {
      padding:8px 14px;
      font-size:16px;
      cursor:pointer;
    }
    #scoreSaved {
      display:none;
      color:#3c763d;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div id="passwordPrompt">
    <h2>Enter Password to Play</h2>
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="checkPassword()">Submit</button>
    <p id="error" style="color:red;display:none;">Incorrect password</p>
  </div>

  <div id="gameContainer" style="display:none;">
    <div id="leaderboardContainer">
      <h3>Leaderboard</h3>
      <ol id="leaderboardList"></ol>
      <div id="leaderboardForm" aria-live="polite">
        <input type="text" id="playerName" placeholder="Enter your name">
        <button onclick="submitScore()">Submit Score</button>
        <div id="scoreSaved">Score saved!</div>
      </div>
    </div>
    <div id="scoreboard">
      <div>Your current score: <span id="currentScore">0</span></div>
      <div>Your high score: <span id="highScore">0</span></div>
    </div>
    <div id="board"></div>
    <div id="gameOverOverlay" style="display:none;">
      <div>Game Over</div>
      <button onclick="restartGame()">Restart</button>
    </div>
    <div class="watermark">AdyrStudios <span class="star">✡</span></div>
  </div>

  <script>
    const SIZE=4;
    let grid;
    let currentMax=2;
    let highMax=2;
    let leaderboard=[];

    const nameMap={
      2:"Gabe",
      4:"Hannah",
      8:"Adam Taylor",
      16:"Lex",
      32:"Kate",
      64:"Adyr",
      128:"Brooke",
      256:"Ben Lightstone",
      512:"Linoy",
      1024:"Adam Storger",
      2048:"Stewie"
    };

    const imageMap={
      2:"images/2.png",
      4:"images/4.png",
      8:"images/8.png",
      16:"images/16.png",
      32:"images/32.png",
      64:"images/64.png",
      128:"images/128.png",
      256:"images/256.png",
      512:"images/512.png",
@@ -205,38 +260,87 @@
    }

    function showGameOver(){
      document.getElementById('gameOverOverlay').style.display='flex';
    }

    function restartGame(){
      document.getElementById('gameOverOverlay').style.display='none';
      startGame();
    }

    function checkPassword(){
      const input=document.getElementById('passwordInput').value;
      if(input==="mcjewish"){
        document.getElementById('passwordPrompt').style.display='none';
        document.getElementById('gameContainer').style.display='block';
        startGame();
      } else {
        document.getElementById('error').style.display='block';
      }
    }

    function startGame(){
      grid=createEmpty();
      currentMax=2;
      document.getElementById('scoreSaved').style.display='none';
      setupBoard();
      addRandom();addRandom();
      draw();
      window.addEventListener('keydown',e=>{
        if(e.key==='ArrowLeft')move('left');
        if(e.key==='ArrowRight')move('right');
        if(e.key==='ArrowUp')move('up');
        if(e.key==='ArrowDown')move('down');
      window.addEventListener('keydown',handleKeydown,{once:true});
    }

    function handleKeydown(e){
      document.getElementById('scoreSaved').style.display='none';
      if(e.key==='ArrowLeft')move('left');
      if(e.key==='ArrowRight')move('right');
      if(e.key==='ArrowUp')move('up');
      if(e.key==='ArrowDown')move('down');
      window.addEventListener('keydown',handleKeydown,{once:true});
    }

    function loadLeaderboard(){
      const saved=localStorage.getItem('leaderboard');
      leaderboard=saved?JSON.parse(saved):[];
      renderLeaderboard();
    }

    function saveLeaderboard(){
      localStorage.setItem('leaderboard',JSON.stringify(leaderboard));
    }

    function sortedEntries(){
      return [...leaderboard].sort((a,b)=>b.score-a.score).slice(0,10);
    }

    function renderLeaderboard(){
      const list=document.getElementById('leaderboardList');
      list.innerHTML='';
      sortedEntries().forEach(({name,score})=>{
        const li=document.createElement('li');
        const label=nameMap[score]||score;
        li.textContent=`${name} — ${label}`;
        list.appendChild(li);
      });
    }

    function submitScore(){
      const input=document.getElementById('playerName');
      const name=input.value.trim()||'Anonymous';
      leaderboard=[...leaderboard,{name,score:currentMax}];
      leaderboard=sortedEntries();
      saveLeaderboard();
      renderLeaderboard();
      input.value='';
      document.getElementById('scoreSaved').style.display='block';
    }

    loadLeaderboard();
    document.getElementById('playerName').addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        submitScore();
      }
    });
  </script>
</body>
</html>
