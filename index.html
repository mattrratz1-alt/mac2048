<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2048 — Folder Images</title>
  <style>
    body{
      margin:0;
      font-family:sans-serif;
      background:#faf8ef;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* Board */
    #board{
      display:grid;
      grid-template-columns:repeat(4,100px);
      grid-gap:10px;
      background:#bbada0;
      padding:10px;
      border-radius:10px;
      position:relative;
    }
    .cell{
      width:100px;
      height:100px;
      background:#cdc1b4;
      border-radius:5px;
      position:relative;
      overflow:hidden;
    }
    .tile{
      position:absolute;
      top:0;left:0;right:0;bottom:0;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:20px;
      font-weight:bold;
      color:#fff;
      border-radius:5px;
      text-align:center;
      padding:0;
    }
    .tile img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:5px;
      display:block;
    }

    /* Watermark */
    .watermark{
      margin-top:15px;
      font-size:14px;
      color:#776e65;
      opacity:0.7;
      user-select:none;
      text-align:center;
      width:100%;
    }
    .watermark .star{
      margin-left:2px;
    }

    /* Password gate */
    #passwordPrompt{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#faf8ef;
    }
    #passwordPrompt input{
      padding:8px;
      font-size:16px;
      margin-top:10px;
    }
    #passwordPrompt button{
      margin-top:10px;
      padding:8px 16px;
      font-size:16px;
      cursor:pointer;
    }

    /* Game over overlay */
    #gameOverOverlay{
      position:absolute;
      top:0;left:0;
      width:100%;height:100%;
      background:rgba(238,228,218,0.8);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      font-size:32px;
      color:#776e65;
      font-weight:bold;
      border-radius:10px;
      z-index:10;
    }
    #gameOverOverlay h2{
      margin:0 0 16px;
      font-size:32px;
    }
    #gameOverContent{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      font-size:16px;
    }
    #overlayName{
      padding:6px 8px;
      font-size:16px;
      width:220px;
    }
    #overlaySubmitBtn{
      padding:8px 14px;
      font-size:16px;
      cursor:pointer;
    }
    #overlaySaved{
      display:none;
      color:#3c763d;
      font-size:14px;
    }

    /* Scoreboard */
    #scoreboard{
      margin-bottom:20px;
      text-align:center;
      font-size:18px;
      color:#776e65;
    }
    #scoreboard div{
      margin:5px 0;
    }

    /* Leaderboard */
    #leaderboardContainer{
      margin:0 auto 20px;
      background:#eee4da;
      padding:12px 16px;
      border-radius:8px;
      max-width:320px;
      color:#776e65;
    }
    #leaderboardContainer h3{
      margin:0 0 8px;
      font-size:18px;
      text-align:center;
    }
    #leaderboardList{
      padding-left:18px;
      margin:0;
    }
    #leaderboardList li{
      margin:4px 0;
      font-size:16px;
    }
  </style>
</head>
<body>
  <!-- PASSWORD GATE -->
  <div id="passwordPrompt">
    <h2>Enter Password to Play</h2>
    <input type="password" id="passwordInput" placeholder="Password" autofocus>
    <button id="passwordBtn" type="button">Submit</button>
    <p id="error" style="color:red;display:none;">Password incorrect. Try again.</p>
  </div>

  <!-- GAME -->
  <div id="gameContainer" style="display:none;">
    <div id="leaderboardContainer">
      <h3>Global Leaderboard</h3>
      <ol id="leaderboardList"></ol>
    </div>

    <div id="scoreboard">
      <div>Your current score: <span id="currentScore">0</span></div>
      <div>Your high score: <span id="highScore">0</span></div>
    </div>

    <div id="board"></div>

    <!-- Game over + name submission merged -->
    <div id="gameOverOverlay" style="display:none;">
      <h2>Game Over</h2>
      <div id="gameOverContent">
        <div id="finalScoreText"></div>
        <input type="text" id="overlayName" placeholder="Enter your name to save your score">
        <button id="overlaySubmitBtn" type="button">Submit Score</button>
        <div id="overlaySaved">Score saved!</div>
      </div>
    </div>

    <div class="watermark">AdyrStudios <span class="star">✡</span></div>
  </div>

  <script>
    // ====== CONFIG: global leaderboard endpoint ======
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyhYipJDhXuc-RmzcqexzX-GLI980xeviOcbH65Nzu6HDyQIww014siVLYCOy1GhiYPRA/exec";

    // ====== GAME STATE ======
    const SIZE = 4;
    let grid;
    let currentMax = 2;   // highest tile this run
    let leaderboard = []; // global top 5

    const nameMap = {
      2:"Gabe",
      4:"Hannah",
      8:"Adam Taylor",
      16:"Lex",
      32:"Kate",
      64:"Adyr",
      128:"Brooke",
      256:"Ben Lightstone",
      512:"Linoy",
      1024:"Adam Storger",
      2048:"Stewie"
    };

    const imageMap = {
      2:"images/2.png",
      4:"images/4.png",
      8:"images/8.png",
      16:"images/16.png",
      32:"images/32.png",
      64:"images/64.png",
      128:"images/128.png",
      256:"images/256.png",
      512:"images/512.png",
      1024:"images/1024.png",
      2048:"images/2048.png"
    };

    // ====== PERSONAL BEST (LOCAL) ======
    const PB_KEY = "personalBestMax_v1";

    function getPersonalBest() {
      try {
        const v = localStorage.getItem(PB_KEY);
        return v ? JSON.parse(v) : 2;
      } catch(e) {
        return 2;
      }
    }

    function setPersonalBest(v) {
      try {
        localStorage.setItem(PB_KEY, JSON.stringify(v));
      } catch(e) {}
    }

    // ====== PASSWORD GATE ======
    function checkPassword() {
      const input = (document.getElementById("passwordInput").value || "").trim();
      if (input === "mcjewish") {
        document.getElementById("passwordPrompt").style.display = "none";
        document.getElementById("gameContainer").style.display = "block";
        document.getElementById("error").style.display = "none";
        loadLeaderboard();
        startGame();
      } else {
        document.getElementById("error").style.display = "block";
      }
    }

    document.getElementById("passwordBtn")
      .addEventListener("click", checkPassword);
    document.getElementById("passwordInput")
      .addEventListener("keydown", function(e){
        if(e.key === "Enter"){
          e.preventDefault();
          checkPassword();
        }
      });

    // ====== BOARD HELPERS ======
    const board = document.getElementById("board");

    function createEmpty(){
      const arr = [];
      for(let r=0;r<SIZE;r++){
        const row = [];
        for(let c=0;c<SIZE;c++) row.push(0);
        arr.push(row);
      }
      return arr;
    }

    function addRandom(){
      const empty = [];
      for(let r=0;r<SIZE;r++)
        for(let c=0;c<SIZE;c++)
          if(!grid[r][c]) empty.push([r,c]);
      if(!empty.length) return;
      const pick = empty[Math.floor(Math.random()*empty.length)];
      grid[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
    }

    function setupBoard(){
      board.innerHTML = "";
      for(let i=0;i<SIZE*SIZE;i++){
        const cell = document.createElement("div");
        cell.className = "cell";
        board.appendChild(cell);
      }
    }

    function draw(){
      currentMax = 2;
      const tiles = board.querySelectorAll(".tile");
      for(let i=0;i<tiles.length;i++) tiles[i].remove();
      const cells = board.querySelectorAll(".cell");

      for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
          const v = grid[r][c];
          if(!v) continue;
          const tile = document.createElement("div");
          tile.className = "tile";
          if(imageMap[v]){
            const img = document.createElement("img");
            img.src = imageMap[v];
            tile.appendChild(img);
          } else {
            tile.textContent = v;
            tile.style.background = "#edc22e";
          }
          cells[r*SIZE + c].appendChild(tile);
          if(v > currentMax) currentMax = v;
        }
      }

      const best = getPersonalBest();
      document.getElementById("currentScore").textContent =
        nameMap[currentMax] || currentMax;
      document.getElementById("highScore").textContent =
        nameMap[best] || best;
    }

    function compress(row){
      const out = [];
      for(let i=0;i<row.length;i++)
        if(row[i]) out.push(row[i]);
      return out;
    }

    function pad(row){
      while(row.length < SIZE) row.push(0);
      return row;
    }

    function move(dir){
      let moved = false;

      if(dir === "left" || dir === "right"){
        for(let r=0;r<SIZE;r++){
          let row = grid[r].slice();
          if(dir === "right") row.reverse();
          row = compress(row);
          for(let i=0;i<row.length-1;i++){
            if(row[i] && row[i] === row[i+1]){
              row[i] *= 2;
              row[i+1] = 0;
              i++;
            }
          }
          row = pad(compress(row));
          if(dir === "right") row.reverse();
          for(let i=0;i<SIZE;i++){
            if(grid[r][i] !== row[i]) moved = true;
            grid[r][i] = row[i];
          }
        }
      } else {
        for(let c=0;c<SIZE;c++){
          const col = [];
          for(let r=0;r<SIZE;r++) col.push(grid[r][c]);
          if(dir === "down") col.reverse();
          let work = compress(col);
          for(let i=0;i<work.length-1;i++){
            if(work[i] && work[i] === work[i+1]){
              work[i] *= 2;
              work[i+1] = 0;
              i++;
            }
          }
          work = pad(compress(work));
          if(dir === "down") work.reverse();
          for(let r=0;r<SIZE;r++){
            if(grid[r][c] !== work[r]) moved = true;
            grid[r][c] = work[r];
          }
        }
      }

      if(moved) addRandom();
      draw();
      if(checkGameOver()) showGameOver();
    }

    function checkGameOver(){
      let r,c;
      for(r=0;r<SIZE;r++)
        for(c=0;c<SIZE;c++)
          if(grid[r][c] === 0) return false;
      for(r=0;r<SIZE;r++)
        for(c=0;c<SIZE-1;c++)
          if(grid[r][c] === grid[r][c+1]) return false;
      for(c=0;c<SIZE;c++)
        for(r=0;r<SIZE-1;r++)
          if(grid[r][c] === grid[r+1][c]) return false;
      return true;
    }

    function showGameOver(){
      document.getElementById("gameOverOverlay").style.display = "flex";

      // update personal best
      const pb = getPersonalBest();
      if(currentMax > pb) setPersonalBest(currentMax);

      // show final score text and focus name input
      const label = nameMap[currentMax] || currentMax;
      document.getElementById("finalScoreText").textContent =
        "Your score: " + label;
      document.getElementById("overlaySaved").style.display = "none";
      document.getElementById("overlayName").value = "";
      document.getElementById("overlayName").focus();
    }

    function restartGame(){
      document.getElementById("gameOverOverlay").style.display = "none";
      startGame();
    }

    function startGame(){
      grid = createEmpty();
      currentMax = 2;
      setupBoard();
      addRandom();
      addRandom();
      draw();

      window.onkeydown = function(e){
        if(e.key === "ArrowLeft")  move("left");
        if(e.key === "ArrowRight") move("right");
        if(e.key === "ArrowUp")    move("up");
        if(e.key === "ArrowDown")  move("down");
      };
    }

    // ====== GLOBAL LEADERBOARD (Google Apps Script) ======
    function fetchLeaderboard(){
      if(!API_URL) return Promise.resolve([]);
      return fetch(API_URL)
        .then(function(res){ return res.json(); })
        .then(function(data){ return data.scores || []; })
        .catch(function(err){
          console.warn("Leaderboard GET failed", err);
          return [];
        });
    }

  function submitScoreToServer(name, tile){
  if (!API_URL) return Promise.resolve();

  // Fire-and-forget POST; browser doesn't need to read the response.
  return fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    // no custom headers (simpler for browser), just raw JSON body
    body: JSON.stringify({ name: name, tile: tile })
  }).catch(function(err){
    console.warn("Leaderboard POST error", err);
  });
}

    function renderLeaderboard(){
      const list = document.getElementById("leaderboardList");
      list.innerHTML = "";
      for(let i=0;i<leaderboard.length;i++){
        const entry = leaderboard[i];
        const li = document.createElement("li");
        const label = nameMap[entry.tile] || entry.tile;
        li.textContent = entry.name + " — " + label;
        list.appendChild(li);
      }
    }

    function loadLeaderboard(){
      fetchLeaderboard().then(function(scores){
        leaderboard = (scores || []).slice(0,5); // Top 5 only
        renderLeaderboard();
      });
    }

    // called from overlay submit
    function submitScoreAndRestart(){
      const nameInput = document.getElementById("overlayName");
      const name = (nameInput.value || "").trim() || "Anonymous";
      document.getElementById("overlaySaved").style.display = "none";

      submitScoreToServer(name, currentMax).then(function(){
        document.getElementById("overlaySaved").style.display = "block";
        loadLeaderboard();
        // short delay, then hide overlay and restart
        setTimeout(function(){
          document.getElementById("gameOverOverlay").style.display = "none";
          startGame();
        }, 600);
      });
    }

    document.getElementById("overlaySubmitBtn")
      .addEventListener("click", submitScoreAndRestart);
    document.getElementById("overlayName")
      .addEventListener("keydown", function(e){
        if(e.key === "Enter"){
          e.preventDefault();
          submitScoreAndRestart();
        }
      });
  </script>
</body>
</html>
