<script>
  // ==== CONFIG: put your Apps Script URL here ====
  const API_URL = "https://script.google.com/macros/s/AKfycbyhYipJDhXuc-RmzcqexzX-GLI980xeviOcbH65Nzu6HDyQIww014siVLYCOy1GhiYPRA/exec"; // e.g. https://script.google.com/macros/s/XXXX/exec

  // ===== Game State =====
  const SIZE = 4;
  let grid;
  let currentMax = 2;
  let leaderboard = [];

  const nameMap = {
    2: "Gabe",
    4: "Hannah",
    8: "Adam Taylor",
    16: "Lex",
    32: "Kate",
    64: "Adyr",
    128: "Brooke",
    256: "Ben Lightstone",
    512: "Linoy",
    1024: "Adam Storger",
    2048: "Stewie"
  };

  const imageMap = {
    2: "images/2.png",
    4: "images/4.png",
    8: "images/8.png",
    16: "images/16.png",
    32: "images/32.png",
    64: "images/64.png",
    128: "images/128.png",
    256: "images/256.png",
    512: "images/512.png",
    1024: "images/1024.png",
    2048: "images/2048.png"
  };

  // ===== Password Gate =====
  function checkPassword() {
    const val = (document.getElementById("passwordInput").value || "").trim();
    if (val === "mcjewish") {
      document.getElementById("passwordPrompt").style.display = "none";
      document.getElementById("gameContainer").style.display = "block";
      loadLeaderboard();
      startGame();
    } else {
      document.getElementById("error").style.display = "block";
    }
  }
  document.getElementById("passwordBtn")
    .addEventListener("click", checkPassword);
  document.getElementById("passwordInput")
    .addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        checkPassword();
      }
    });

  // ===== Board Helpers =====
  function createEmpty() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function addRandom() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  const board = document.getElementById("board");

  function setupBoard() {
    board.innerHTML = "";
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      board.appendChild(cell);
    }
  }

  function getPersonalBest() {
    try {
      const v = localStorage.getItem("personalBestMax_v1");
      return v ? JSON.parse(v) : 2;
    } catch (e) {
      return 2;
    }
  }

  function setPersonalBest(v) {
    try {
      localStorage.setItem("personalBestMax_v1", JSON.stringify(v));
    } catch (e) {}
  }

  function draw() {
    currentMax = 2;
    board.querySelectorAll(".tile").forEach(t => t.remove());
    const cells = board.querySelectorAll(".cell");

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (!v) continue;
        const tile = document.createElement("div");
        tile.className = "tile";
        if (imageMap[v]) {
          const img = document.createElement("img");
          img.src = imageMap[v];
          tile.appendChild(img);
        } else {
          tile.textContent = v;
          tile.style.background = "#edc22e";
        }
        cells[r * SIZE + c].appendChild(tile);
        if (v > currentMax) currentMax = v;
      }
    }

    const best = getPersonalBest();
    document.getElementById("currentScore").textContent =
      nameMap[currentMax] || currentMax;
    document.getElementById("highScore").textContent =
      nameMap[best] || best;
  }

  function compress(row) {
    return row.filter(x => x);
  }

  function pad(row) {
    while (row.length < SIZE) row.push(0);
    return row;
  }

  function move(dir) {
    let moved = false;

    if (dir === "left" || dir === "right") {
      for (let r = 0; r < SIZE; r++) {
        let row = grid[r].slice();
        if (dir === "right") row.reverse();
        row = compress(row);
        for (let i = 0; i < row.length - 1; i++) {
          if (row[i] && row[i] === row[i + 1]) {
            row[i] *= 2;
            row[i + 1] = 0;
            i++;
          }
        }
        row = pad(compress(row));
        if (dir === "right") row.reverse();
        if (row.some((v, i) => v !== grid[r][i])) moved = true;
        grid[r] = row;
      }
    } else {
      for (let c = 0; c < SIZE; c++) {
        let col = grid.map(r => r[c]);
        if (dir === "down") col.reverse();
        col = compress(col);
        for (let i = 0; i < col.length - 1; i++) {
          if (col[i] && col[i] === col[i + 1]) {
            col[i] *= 2;
            col[i + 1] = 0;
            i++;
          }
        }
        col = pad(compress(col));
        if (dir === "down") col.reverse();
        for (let r = 0; r < SIZE; r++) {
          if (grid[r][c] !== col[r]) moved = true;
          grid[r][c] = col[r];
        }
      }
    }

    if (moved) addRandom();
    draw();
    if (checkGameOver()) showGameOver();
  }

  function checkGameOver() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) return false;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE - 1; c++)
        if (grid[r][c] === grid[r][c + 1]) return false;
    for (let c = 0; c < SIZE; c++)
      for (let r = 0; r < SIZE - 1; r++)
        if (grid[r][c] === grid[r + 1][c]) return false;
    return true;
  }

  function showGameOver() {
    document.getElementById("gameOverOverlay").style.display = "flex";
    const pb = getPersonalBest();
    if (currentMax > pb) setPersonalBest(currentMax);
  }

  function restartGame() {
    document.getElementById("gameOverOverlay").style.display = "none";
    startGame();
  }

  function startGame() {
    grid = createEmpty();
    currentMax = 2;
    document.getElementById("scoreSaved").style.display = "none";
    setupBoard();
    addRandom();
    addRandom();
    draw();

    window.onkeydown = function (e) {
      if (e.key === "ArrowLeft") move("left");
      if (e.key === "ArrowRight") move("right");
      if (e.key === "ArrowUp") move("up");
      if (e.key === "ArrowDown") move("down");
    };
  }

  // ===== Global leaderboard via Google Apps Script =====
  function fetchLeaderboard() {
    if (!API_URL) return Promise.resolve([]);
    return fetch(API_URL)
      .then(function (res) { return res.json(); })
      .then(function (data) { return data.scores || []; })
      .catch(function () { return []; });
  }

  function submitScoreToServer(name, tile) {
    if (!API_URL) return Promise.resolve();
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, tile: tile })
    }).catch(function () { });
  }

  function renderLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";
    leaderboard.forEach(function (entry) {
      const li = document.createElement("li");
      const label = nameMap[entry.tile] || entry.tile;
      li.textContent = entry.name + " — " + label;
      list.appendChild(li);
    });
  }

  function loadLeaderboard() {
    fetchLeaderboard().then(function (scores) {
      leaderboard = scores;
      renderLeaderboard();
    });
  }

  function submitScore() {
    const input = document.getElementById("playerName");
    const name = (input.value || "").trim() || "Anonymous";
    document.getElementById("scoreSaved").style.display = "none";
    submitScoreToServer(name, currentMax).then(function () {
      document.getElementById("scoreSaved").style.display = "block";
      loadLeaderboard();
    });
    input.value = "";
  }

  document.getElementById("submitScoreBtn")
    .addEventListener("click", submitScore);
  document.getElementById("playerName")
    .addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        submitScore();
      }
    });
</script>
